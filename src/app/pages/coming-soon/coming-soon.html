<main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-20 sm:py-28 text-center">
  @if (category) {
    <div
      class="mx-auto w-20 h-20 rounded-2xl flex items-center justify-center mb-8 {{ category.accent }}"
    >
      <app-category-icon [slug]="category.slug" iconClass="h-10 w-10"></app-category-icon>
    </div>
    <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight mb-4">
      {{ category.title }} is coming soon
    </h1>
    <p class="text-lg text-gray-600 mb-10">
      {{ category.description }} We're working hard to open this section of SimSim.
    </p>
  }

  <div class="flex flex-col sm:flex-row gap-3 justify-center">
    <a
      routerLink="/"
      class="inline-flex items-center justify-center rounded-md font-medium border border-gray-300 bg-white hover:bg-gray-50 text-gray-700 h-12 px-6 transition-colors"
    >
      All categories
    </a>
    @for (live of liveCategories; track live.slug) {
      <a
        [routerLink]="['/', live.slug]"
        class="inline-flex items-center justify-center rounded-md font-medium bg-blue-700 text-white hover:bg-blue-800 shadow-sm h-12 px-6 transition-colors"
      >
        Explore {{ live.title }}
      </a>
    }
  </div>
</main>
